# MediaMTX cho robot_stream: nhận H.264 từ stream_node qua RTP/UDP nội bộ,
# phát WebRTC/WHEP tại http://<ip-robot>:8889/robot_cam/whep.
# Key nào không ghi ở đây dùng giá trị mặc định của MediaMTX.

logLevel: info

# Chỉ tiến trình trên robot được đẩy luồng; máy khác chỉ được xem.
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
      - action: api
      - action: metrics
  - user: any
    pass:
    ips: []
    permissions:
      - action: read

# API chỉ nghe trên localhost, để kiểm tra số người xem / trạng thái luồng.
api: true
apiAddress: 127.0.0.1:9997

# stream_node đẩy RTP H.264 qua UDP 127.0.0.1:9000 (xem paths). Không dùng RTSP vì
# robot thiếu rtspclientsink; không dùng RTMP vì rtmp2sink đòi URL dạng app/stream;
# không dùng MPEG-TS vì MediaMTX phải chờ frame sau mới tách được frame trước (+~50 ms).
rtmp: false
rtsp: false
hls: false
srt: false
# MoQ (mặc định bật từ v1.2x) mở thêm :8892/:8893 – không dùng.
moq: false

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Chỉ quảng bá IP Wifi, tránh ICE candidate của docker0 / l4tbr0 nếu có.
# Card mạng quảng bá cho WebRTC: theo hồ sơ robot (stream.launch.py đặt biến môi
# trường MTX_WEBRTCIPSFROMINTERFACESLIST, vd R550 wlP1p1s0). Rỗng = mọi interface.
webrtcIPsFromInterfacesList: []

paths:
  robot_cam:
    # Chỉ nghe trên localhost: máy khác không đẩy luồng giả vào được.
    source: udp+rtp://127.0.0.1:9000
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=robot_cam
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 9000 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1
