name: robot_stream_webrtc
description: Low-latency WebRTC/WHEP video source and Flutter widget for ROS 2 robots via flutter_webrtc, with Android low-latency WifiLock.
version: 0.1.0
repository: https://github.com/robot-stream/robot_stream/tree/main/packages/robot_stream_webrtc
issue_tracker: https://github.com/robot-stream/robot_stream/issues
resolution: workspace

topics:
  - ros
  - ros2
  - robotics
  - webrtc
  - whep

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  http: ^1.2.0
  robot_stream_core: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.robotstream.robot_stream_webrtc
        pluginClass: RobotStreamWebrtcPlugin
      ios:
        pluginClass: RobotStreamWebrtcPlugin
      macos:
        pluginClass: RobotStreamWebrtcPlugin
