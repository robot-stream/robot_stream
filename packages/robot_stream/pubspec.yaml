name: robot_stream
description: All-in-one Flutter package for low-latency ROS 2 robot video streaming (WebRTC/WHEP, MJPEG), telemetry, Nav2 navigation, and deadman teleop.
version: 0.1.0
repository: https://github.com/robot-stream/robot_stream/tree/main/packages/robot_stream
issue_tracker: https://github.com/robot-stream/robot_stream/issues
resolution: workspace

topics:
  - ros
  - ros2
  - robotics
  - webrtc
  - mjpeg

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  robot_stream_core: ^0.1.0
  robot_stream_mjpeg: ^0.1.0
  robot_stream_rosbridge: ^0.1.0
  robot_stream_webrtc: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
