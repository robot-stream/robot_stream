name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages apps/example

      - name: Analyze all Dart/Flutter packages
        run: dart run melos analyze

      - name: Run Dart/Flutter tests
        run: dart run melos test

      - name: Run Python unit tests (robot_node)
        run: |
          for t in robot_node/robot_stream_ros/test/test_*.py; do
            echo "Running $t"
            PYTHONPATH=robot_node/robot_stream_ros python3 "$t"
          done
